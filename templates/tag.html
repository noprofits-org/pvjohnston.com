<section class="archive">
    <div class="archive-inner">
        <div class="archive-masthead">
            <div class="masthead-meta">
                <span class="meta-dot" aria-hidden="true"></span>
                <span class="meta-place">Writing</span>
                <span class="meta-rule" aria-hidden="true"></span>
                <span class="meta-kind">$tagCount$</span>
            </div>
            <h1 class="archive-title">#$tag$</h1>
            <p class="archive-sub">Every note tagged <em>#$tag$</em>, newest first — or browse <a href="/writing.html">the full archive</a>.</p>
        </div>
        $partial("templates/post-list.html")$
    </div>
</section>
