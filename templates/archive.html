<section class="archive">
    <div class="archive-inner">
        <div class="archive-masthead">
            <div class="masthead-meta">
                <span class="meta-dot" aria-hidden="true"></span>
                <span class="meta-place">Writing</span>
                <span class="meta-rule" aria-hidden="true"></span>
                <span class="meta-kind">Every Note</span>
            </div>
            <h1 class="archive-title">The full archive</h1>
            <p class="archive-sub">Chemistry, physics, mathematics, art, software, and systems — newest first.</p>
            $if(tagCloud)$<div class="tag-cloud">$tagCloud$</div>$endif$
        </div>
        $for(years)$
        <section class="archive-year" aria-labelledby="year-$year$">
            <h2 class="year-head" id="year-$year$">$year$</h2>
            $partial("templates/post-list.html")$
        </section>
        $endfor$
    </div>
</section>
